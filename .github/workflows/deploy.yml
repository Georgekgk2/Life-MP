# =============================================================================
# Life-MP Deploy — Build & Deploy to Production Server
# =============================================================================
# Тригери:
#   - workflow_dispatch (ручний запуск із вибором середовища)
#   - push to main (auto-deploy to staging, якщо увімкнено)
#
# Попередження: deploy to production вимагає схвалення через GitHub Environment.
# =============================================================================

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: "Skip pre-deploy tests"
        required: false
        default: false
        type: boolean

  # Uncomment when staging auto-deploy is ready:
  # push:
  #   branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  COMMERCE_IMAGE: ghcr.io/${{ github.repository }}/commerce
  STOREFRONT_IMAGE: ghcr.io/${{ github.repository }}/storefront

jobs:
  # ===========================================================================
  # Validate
  # ===========================================================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Determine environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Check if should deploy
        id: check
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

  # ===========================================================================
  # Pre-Deploy Tests (unless skipped)
  # ===========================================================================
  test:
    name: Pre-Deploy Tests
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.should_deploy == 'true' && github.event.inputs.skip_tests != 'true'
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_bootstrap
          POSTGRES_PASSWORD: ci_bootstrap_password
          POSTGRES_DB: ci_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Bootstrap test DB
        env:
          TEST_BOOTSTRAP_DATABASE_URL: postgresql://ci_bootstrap:ci_bootstrap_password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/ci_control
          TEST_APPLICATION_DATABASE_URL: postgresql://life_medusa_test:ci_test_password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/life_medusa_test
        run: pnpm --filter @life/commerce exec tsx ./src/scripts/bootstrap-ci-test-database.ts

      - name: Integration tests
        env:
          DATABASE_URL: postgresql://life_medusa_test:ci_test_password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/life_medusa_test
          TEST_DATABASE_URL: postgresql://life_medusa_test:ci_test_password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/life_medusa_test
          DB_HOST: "127.0.0.1"
          DB_PORT: "${{ job.services.postgres.ports[5432] }}"
          DB_USERNAME: "life_medusa_test"
          DB_PASSWORD: "ci_test_password"
          DB_NAME: "life_medusa_test"
          DB_WAITINGROOM_DATABASE: "postgres"
          REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports[6379] }}
          NODE_ENV: test
          ALLOW_SYNTHETIC_CATALOG: "true"
          JWT_SECRET: ci_jwt_secret_test_only
          COOKIE_SECRET: ci_cookie_secret_test_only
        run: pnpm run test:integration

  # ===========================================================================
  # Build Docker Images & Push to GHCR
  # ===========================================================================
  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: [validate, test]
    if: always() && needs.validate.outputs.should_deploy == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    outputs:
      commerce_tag: ${{ steps.commerce.outputs.tag }}
      storefront_tag: ${{ steps.storefront.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Commerce
        id: commerce
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.commerce
          push: true
          tags: |
            ${{ env.COMMERCE_IMAGE }}:${{ needs.validate.outputs.image_tag }}
            ${{ env.COMMERCE_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Storefront
        id: storefront
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.storefront
          push: true
          tags: |
            ${{ env.STOREFRONT_IMAGE }}:${{ needs.validate.outputs.image_tag }}
            ${{ env.STOREFRONT_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record image tags
        run: |
          echo "Commerce: ${{ env.COMMERCE_IMAGE }}:${{ needs.validate.outputs.image_tag }}"
          echo "Storefront: ${{ env.STOREFRONT_IMAGE }}:${{ needs.validate.outputs.image_tag }}"

  # ===========================================================================
  # Deploy to Staging
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: needs.validate.outputs.environment == 'staging'
    environment:
      name: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail

            TAG="${{ needs.validate.outputs.image_tag }}"
            COMPOSE_FILE="/opt/life-mp/deploy/docker-compose.prod.yml"
            ENV_FILE="/opt/life-mp/.env"

            echo "=== Life-MP Staging Deploy: ${TAG} ==="

            cd /opt/life-mp
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull new images
            docker pull ${{ env.COMMERCE_IMAGE }}:${TAG}
            docker pull ${{ env.STOREFRONT_IMAGE }}:${TAG}

            # Deploy with zero-downtime restart
            COMMERCE_IMAGE=${{ env.COMMERCE_IMAGE }}:${TAG} \
            STOREFRONT_IMAGE=${{ env.STOREFRONT_IMAGE }}:${TAG} \
            docker compose -f ${COMPOSE_FILE} --env-file ${ENV_FILE} up -d --remove-orphans

            # Wait for health
            echo "Waiting for services to be healthy..."
            sleep 15
            docker compose -f ${COMPOSE_FILE} ps

            # Health check
            if curl -sf http://localhost:9000/health > /dev/null 2>&1; then
              echo "Commerce: OK"
            else
              echo "::error::Commerce health check failed"
              exit 1
            fi

            echo "=== Deploy complete ==="

  # ===========================================================================
  # Deploy to Production (requires approval)
  # ===========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: needs.validate.outputs.environment == 'production'
    environment:
      name: production # Requires manual approval in GitHub
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Create backup marker
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            BACKUP_DIR="/opt/life-mp/backups/pre-deploy"
            mkdir -p "${BACKUP_DIR}"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)

            # Database backup
            docker exec life-postgres pg_dump -U ${POSTGRES_USER:-life_prod} ${POSTGRES_DB:-life_production} | gzip > "${BACKUP_DIR}/db_${TIMESTAMP}.sql.gz" 2>/dev/null || echo "DB backup skipped (container may not be running)"

            # Record current image tags
            docker inspect life-commerce --format='{{.Config.Image}}' > "${BACKUP_DIR}/commerce_image_${TIMESTAMP}.txt" 2>/dev/null || true
            docker inspect life-storefront --format='{{.Config.Image}}' > "${BACKUP_DIR}/storefront_image_${TIMESTAMP}.txt" 2>/dev/null || true

            echo "Pre-deploy backup created: ${TIMESTAMP}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail

            TAG="${{ needs.validate.outputs.image_tag }}"
            COMPOSE_FILE="/opt/life-mp/deploy/docker-compose.prod.yml"
            ENV_FILE="/opt/life-mp/.env"

            echo "=== Life-MP Production Deploy: ${TAG} ==="

            cd /opt/life-mp
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull immutable images
            docker pull ${{ env.COMMERCE_IMAGE }}:${TAG}
            docker pull ${{ env.STOREFRONT_IMAGE }}:${TAG}

            # Deploy
            COMMERCE_IMAGE=${{ env.COMMERCE_IMAGE }}:${TAG} \
            STOREFRONT_IMAGE=${{ env.STOREFRONT_IMAGE }}:${TAG} \
            docker compose -f ${COMPOSE_FILE} --env-file ${ENV_FILE} up -d --remove-orphans

            # Wait for health
            echo "Waiting for services to be healthy..."
            sleep 20
            docker compose -f ${COMPOSE_FILE} ps

            # Health checks
            if curl -sf http://localhost:9000/health > /dev/null 2>&1; then
              echo "Commerce: OK"
            else
              echo "::error::Commerce health check failed — initiating rollback"
              docker compose -f ${COMPOSE_FILE} down
              # Rollback: restart with previous images (from backup marker)
              PREV_TAG=$(cat /opt/life-mp/backups/pre-deploy/commerce_image_*.txt 2>/dev/null | tail -1 || echo "")
              if [ -n "$PREV_TAG" ]; then
                echo "Rolling back to: ${PREV_TAG}"
                COMMERCE_IMAGE=${PREV_TAG} docker compose -f ${COMPOSE_FILE} --env-file ${ENV_FILE} up -d
              fi
              exit 1
            fi

            echo "=== Production deploy complete ==="

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Production deployment failed. Check rollback status on server."
