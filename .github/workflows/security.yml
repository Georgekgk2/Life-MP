# =============================================================================
# Life-MP Security Scan
# =============================================================================
# Fail-closed безпековий аудит: Gitleaks для секретів, pnpm audit, Trivy для контейнерів.
# =============================================================================

name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # Щопонеділка о 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Secret Detection (Gitleaks)
  # ===========================================================================
  secrets-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # ===========================================================================
  # Dependency Audit (Fail-Closed)
  # ===========================================================================
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (Fail-Closed)
        run: |
          echo "Running strict fail-closed production dependency audit..."
          pnpm audit --prod --audit-level=high

  # ===========================================================================
  # Container Image Scan (Trivy) — Fail-Closed
  # ===========================================================================
  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: commerce
            dockerfile: deploy/Dockerfile.commerce
            image: life-commerce-scan
          - name: storefront
            dockerfile: deploy/Dockerfile.storefront
            image: life-storefront-scan

    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Build image for scanning
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --load \
            -t ${{ matrix.image }}:scan \
            -f ${{ matrix.dockerfile }} \
            .

      - name: Run Trivy vulnerability scanner (Fail-Closed)
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          image-ref: "${{ matrix.image }}:scan"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
        env:
          TRIVY_NO_PROGRESS: "true"

      - name: Check for secret layer artifacts
        run: |
          echo "Checking for accidentally included secrets in container image history..."
          HISTORY=$(docker history --no-trunc ${{ matrix.image }}:scan 2>/dev/null || true)
          if echo "$HISTORY" | grep -iE '\.env|secret|password|token|key\.pem'; then
            echo "::error::Potential secret artifacts found in image layers! Failing build."
            exit 1
          fi
          echo "No secret layer artifacts detected."
