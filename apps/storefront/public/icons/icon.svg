<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a4d3d" />
      <stop offset="100%" stop-color="#14261e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2aa58" />
      <stop offset="100%" stop-color="#c48b3f" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="url(#pineGrad)" />

  <!-- Inner border ring -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Decorative craft leaf & letter 'Л' emblem -->
  <g filter="url(#shadow)">
    <!-- Ukrainian Craft Motif: stylized organic leaf / arch representing 'Л' (ЛАЙФ) -->
    <path d="M 256 108 C 290 108 348 180 348 290 C 348 370 290 404 256 404 C 222 404 164 370 164 290 C 164 180 222 108 256 108 Z" fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Central artisan grain / seed core -->
    <path d="M 256 170 C 274 210 292 260 292 304 C 292 344 274 366 256 366 C 238 366 220 344 220 304 C 220 260 238 210 256 170 Z" fill="url(#goldGrad)" />
    
    <!-- Sun/authenticity dot -->
    <circle cx="256" cy="138" r="14" fill="#faf7f2" />
  </g>

  <!-- Brand text ribbon 'ЛАЙФ' -->
  <text x="256" y="448" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" letter-spacing="8" fill="#faf7f2">ЛАЙФ</text>
</svg>
