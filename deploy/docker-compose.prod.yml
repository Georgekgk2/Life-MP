# =============================================================================
# UNAPPROVED TEMPLATE — DO NOT DEPLOY (Phase P0 Containment)
# Life-MP Production Docker Compose Template
# =============================================================================
# УВАГА: цей файл є шаблоном конфігурації. Будь-яке розгортання заборонено
# політикою безпеки (Phase P0 Containment) до проходження всіх воріт готовності.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: life-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - life-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --username=${POSTGRES_USER} --dbname=${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: life-redis
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - redis-data:/data
    networks:
      - life-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 192M

  # ---------------------------------------------------------------------------
  # Commerce (Medusa v2)
  # ---------------------------------------------------------------------------
  commerce:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.commerce
    image: ${COMMERCE_IMAGE:?COMMERCE_IMAGE_REQUIRED}
    container_name: life-commerce
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      STORE_CORS: ${STORE_CORS}
      ADMIN_CORS: ${ADMIN_CORS}
      AUTH_CORS: ${AUTH_CORS}
      PORT: "9000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - life-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  # ---------------------------------------------------------------------------
  # Storefront (Next.js)
  # ---------------------------------------------------------------------------
  storefront:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.storefront
      args:
        NEXT_PUBLIC_MEDUSA_API_URL: ${NEXT_PUBLIC_MEDUSA_API_URL:-/api}
    image: ${STOREFRONT_IMAGE:?STOREFRONT_IMAGE_REQUIRED}
    container_name: life-storefront
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      MEDUSA_API_URL: http://commerce:9000
      # Reserved for an approved Medusa catalog/review source; production guards stay fail-closed.
      MEDUSA_BACKEND_URL: http://commerce:9000
      NEXT_PUBLIC_MEDUSA_API_URL: ${NEXT_PUBLIC_MEDUSA_API_URL:-/api}
      CATALOG_SOURCE: medusa
      ALLOW_SYNTHETIC_CATALOG: "false"
    depends_on:
      commerce:
        condition: service_healthy
    networks:
      - life-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Caddy (Reverse Proxy + TLS)
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: life-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - storefront
      - commerce
    networks:
      - life-net
    healthcheck:
      test: ["CMD-SHELL", "caddy version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres-data:
    name: life-postgres-data
  redis-data:
    name: life-redis-data
  caddy-data:
    name: life-caddy-data
  caddy-config:
    name: life-caddy-config

networks:
  life-net:
    name: life-net
    driver: bridge
