# =============================================================================
# Life-MP Production Docker Compose Stack (Isolated Shared-Host Profile)
# =============================================================================
# Conforms to Zero-Public-Port & Shared-Server Isolation Policy:
# 1. No public 80/443 bindings (ingress handled via Cloudflare Tunnel / Shared Proxy).
# 2. Strict loopback bindings for app services (127.0.0.1:3100 and 127.0.0.1:9005).
# 3. Fully private database and cache (no host port exposure).
# 4. Strict memory limits per container (total footprint <= 2GB RAM).
# 5. Prefixed container, network, and volume namespaces (life-mp-*).
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 (Private Storage)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: life-mp-postgres
    command: ["postgres", "-c", "max_connections=150", "-c", "shared_buffers=128MB"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-life_production}
      POSTGRES_USER: ${POSTGRES_USER:-life_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_REQUIRED}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - life-mp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-life_prod} -d ${POSTGRES_DB:-life_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 100
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Redis 7 (Private Cache & Session Store)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: life-mp-redis
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - redis-data:/data
    networks:
      - life-mp-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 192M
          pids: 100
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Commerce Engine (Medusa v2 Headless Backend)
  # ---------------------------------------------------------------------------
  commerce:
    image: ghcr.io/georgekgk2/life-commerce@sha256:ebfe84b4576bbb070442e67c9c8e43d675ef9081f41e2f4ad368c03380cc56ea
    container_name: life-mp-commerce
    environment:
      NODE_ENV: production
      TS_NODE_TRANSPILE_ONLY: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-life_prod}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-life_production}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET_REQUIRED}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET_REQUIRED}
      STORE_CORS: ${STORE_CORS:-https://life-mp.pp.ua}
      ADMIN_CORS: ${ADMIN_CORS:-https://life-mp.pp.ua}
      AUTH_CORS: ${AUTH_CORS:-https://life-mp.pp.ua}
      PORT: "9000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:${HOST_COMMERCE_PORT:-9005}:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - life-mp-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
          pids: 150
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Storefront (Next.js 15 PWA Frontend)
  # ---------------------------------------------------------------------------
  storefront:
    image: ghcr.io/georgekgk2/life-storefront@sha256:7c8ae19636724a77f9cccf6ff617a10c6a6460685adab77819b2bb423a701c71
    container_name: life-mp-storefront
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      MEDUSA_API_URL: http://commerce:9000
      MEDUSA_BACKEND_URL: http://commerce:9000
      NEXT_PUBLIC_MEDUSA_API_URL: ${NEXT_PUBLIC_MEDUSA_API_URL:-https://life-mp.pp.ua/api}
      LIFE_RUNTIME_ENV: public-demo
      CATALOG_SOURCE: fixtures
      ALLOW_PUBLIC_DEMO_CATALOG: "true"
      ALLOW_SYNTHETIC_CATALOG: "false"
    ports:
      - "127.0.0.1:${HOST_STOREFRONT_PORT:-3100}:3000"
    depends_on:
      commerce:
        condition: service_healthy
    networks:
      - life-mp-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 150
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    name: life-mp-postgres-data
  redis-data:
    name: life-mp-redis-data

networks:
  life-mp-net:
    name: life-mp-net
    driver: bridge
