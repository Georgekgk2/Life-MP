# =============================================================================
# Локальні сервіси даних Life-MP
# =============================================================================
# ЛИШЕ ДЛЯ ЛОКАЛЬНОЇ РОЗРОБКИ: цей файл не запускає застосунки та не є
# production-конфігурацією. Значення нижче навмисно не є секретами.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: life_local
      POSTGRES_USER: life_local
      POSTGRES_PASSWORD: life_local_password
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/compose/postgres/001-catalog-provider-core.sql:/docker-entrypoint-initdb.d/001-catalog-provider-core.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=life_local --dbname=life_local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: local_meilisearch_master_key_for_dev_only
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
  meilisearch-data:
