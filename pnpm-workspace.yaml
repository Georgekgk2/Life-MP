packages:
  - apps/*
  - packages/*
# Security-pinned transitive dependencies.
overrides:
  postcss: 8.5.23
  sharp: 0.35.4
  esbuild: 0.25.0
  vite: 6.4.3
  react-router: 8.3.0
  react-router-dom: 7.18.1
  lodash: 4.18.1
  uuid: 11.1.1
  # Security pins for CVE mitigations (brace-expansion, fast-uri, nanoid, js-yaml, multer, qs, csv-parse, morgan)
  brace-expansion: 5.0.12
  fast-uri: ^3.1.8
  nanoid: ^3.3.18
  js-yaml: 4.3.2
  multer: ^2.4.0
  qs: ^6.16.0
  csv-parse: ^7.0.2
  morgan: ^1.12.1
  "@rushstack/node-core-library>ajv": 8.18.0
allowBuilds:
  "@medusajs/telemetry": false
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - globals@17.8.0
