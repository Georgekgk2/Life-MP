packages:
  - apps/*
  - packages/*
# Security-pinned transitive dependencies.
overrides:
  postcss: 8.5.23
  sharp: 0.35.0
  esbuild: 0.25.0
  vite: 6.4.3
  react-router: 8.3.0
  react-router-dom: 7.18.1
  lodash: 4.18.1
  uuid: 11.1.1
  # Security pins for CVE mitigations (brace-expansion, fast-uri, nanoid, js-yaml)
  brace-expansion: 5.0.9
  fast-uri: ^3.1.5
  nanoid: ^3.3.18
  js-yaml: ^4.1.0
  "@rushstack/node-core-library>ajv": 8.18.0
allowBuilds:
  "@medusajs/telemetry": false
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - globals@17.8.0
